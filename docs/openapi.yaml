openapi: 3.1.0

info:
  title: Glik Cobranzas — Portal Cliente API
  version: 0.1.2
  description: |
    API de **autogestión de clientes**
    ([api-autogestion-clientes](https://github.com/ramongonzalez-cmd/api-autogestion-clientes)),
    servicio HTTP separado del staff de cobranzas. Puerto default `8082`
    (`PORT` o `PORT_PORTAL_CLIENTE`).

    BFF que reenvía HTTP hacia cobranzas-backend; el dominio de negocio
    (montos, mora, pagos en_proceso) vive completamente en cobranzas-backend,
    montado en su propio proceso. Documentación interactiva:
    [portal-cliente-api-docs](https://ramongonzalez-cmd.github.io/portal-cliente-api-docs/).

    Auth por OTP SMS + JWT propio (`aud=portal-cliente`, clave RSA distinta
    de staff). Aislamiento estricto por `contrato_id` del claim.

    ## Flujo de autenticación (Swagger UI)

    1. `POST /v1/portal-cliente/auth/solicitar-otp` con tu cédula.
    2. `POST /v1/portal-cliente/auth/verificar-otp` con el código SMS →
       copia `data.access_token` de la respuesta.
    3. Pulsa **Authorize** (candado) arriba, pega el token (sin prefijo
       `Bearer `) y confirma. Swagger enviará
       `Authorization: Bearer <token>` en `mi-cuenta` y `pagos/reportar`.

servers:
  - url: http://localhost:8082
    description: Local development
  - url: https://portal-cliente-api-qa.glik7.com
    description: QA
  - url: https://portal-cliente-api.glik.com.ve
    description: Production (placeholder)

tags:
  - name: health
    description: Liveness
  - name: portal-cliente-auth
    description: Solicitud y verificación de OTP (sin JWT)
  - name: portal-cliente
    description: Mi cuenta y reporte de pagos (requiere JWT vía Authorize)

security: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: portalClienteHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: autogestion-clientes }
              example:
                status: ok
                service: autogestion-clientes

  /v1/portal-cliente/auth/solicitar-otp:
    post:
      tags: [portal-cliente-auth]
      summary: Solicitar OTP por SMS
      operationId: portalClienteSolicitarOTP
      description: |
        Busca `ref_clientes` por cédula, genera OTP 6 dígitos (`crypto/rand`),
        persiste `HMAC-SHA256(pepper, code)` y envía SMS (stub en dev).
        Rate limit: 3/hora por teléfono, 10/hora por IP; cooldown 60s.
        El código no se devuelve en la respuesta (solo llega por SMS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitarOTPRequest"
            example:
              cedula: "111624956"
      responses:
        "200":
          description: Código enviado (destino enmascarado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSolicitarOTP"
              example:
                message: Codigo enviado
                data:
                  destination_masked: "****2233"
                  expires_in_seconds: 300
                  channel: sms
                error: null
                code: 200
        "404":
          description: ERR_CLIENTE_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: Cliente no encontrado
                data: null
                error: ERR_CLIENTE_NO_ENCONTRADO
                code: 404
        "422":
          description: ERR_SIN_TELEFONO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: Cliente sin telefono registrado
                data: null
                error: ERR_SIN_TELEFONO
                code: 422
        "429":
          description: ERR_RATE_LIMIT o ERR_OTP_COOLDOWN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: Espera unos segundos antes de pedir otro codigo
                data: null
                error: ERR_OTP_COOLDOWN
                code: 429

  /v1/portal-cliente/auth/verificar-otp:
    post:
      tags: [portal-cliente-auth]
      summary: Verificar OTP y emitir JWT
      operationId: portalClienteVerificarOTP
      description: |
        Valida OTP (TTL 5 min, max 5 intentos). Resuelve el único contrato
        `activo` del cliente y emite JWT con `cliente_id` + `contrato_id`
        (`aud=portal-cliente`). Si hay más de un activo → ERR_MULTI_CONTRATO.

        Copia `data.access_token` y úsalo en **Authorize** para los endpoints
        protegidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificarOTPRequest"
            example:
              cedula: "111624956"
              codigo: "482917"
      responses:
        "200":
          description: JWT emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVerificarOTP"
              example:
                message: Autenticado
                data:
                  access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJwb3J0YWwtY2xpZW50ZSIsImNsaWVudGVfaWQiOjEwNDIsImNvbnRyYXRvX2lkIjoyMDYyfQ.signature
                  expires_in_seconds: 86400
                  cliente_id: 1042
                  contrato_id: 2062
                error: null
                code: 200
        "400":
          description: OTP inválido / expirado / max intentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: Codigo invalido
                data: null
                error: ERR_OTP_INVALIDO
                code: 400
        "409":
          description: Multi-contrato o sin contrato activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: Mas de un contrato activo; caso no soportado hoy
                data: null
                error: ERR_MULTI_CONTRATO
                code: 409

  /v1/portal-cliente/mi-cuenta:
    get:
      tags: [portal-cliente]
      summary: Resumen de cuenta del contrato del JWT
      operationId: portalClienteMiCuenta
      security:
        - PortalClienteBearer: []
      description: |
        Usa `cliente_id`/`contrato_id` del claim (no del query). Incluye
        `estado_cliente`, `recargo_permanente`, `monto_pago_referencia_usd`
        (encabezado: puntual o puntual+recargo, sin penalidad de cuota),
        cuotas pagadas y próxima cuota con `monto_esperado_usd` (base ±
        recargo + `penalidad_retraso_aplicada` histórica de BD; **no** mezcla
        la prospectiva) y equivalente Bs vía `equivalenteBsDesdeUSDAplicaParam`.

        Si la próxima cuota está **vencida**, puede venir además
        `penalidad_prospectiva_usd` / `penalidad_prospectiva_bs`: cargo
        adicional estimado si pagara hoy (misma regla que Contabilidad /
        `PenalidadRetrasoProspectiva`). Son omitidos si no aplica o si un
        convenio activo congela la fee (resultado 0).

        **UI (app cliente):** cuando `penalidad_prospectiva_usd` venga poblado,
        mostrar el monto base y la penalidad como **dos líneas separadas**, con
        nota de que es un cargo adicional por atraso — no sumarlos en un solo
        número sin explicación.

        **Requiere autenticación previa:** 1) `POST /v1/portal-cliente/auth/solicitar-otp`
        con tu cédula, 2) `POST /v1/portal-cliente/auth/verificar-otp` con el
        código recibido por SMS para obtener el `access_token`, 3) usa ese
        token aquí (botón **Authorize** arriba).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMiCuenta"
              example:
                message: Mi cuenta
                data:
                  cliente_id: 1042
                  contrato_id: 2061
                  mongo_contrato_id: con_MIGTEST_S01021
                  cedula: "111624956"
                  nombre: Cliente Demo
                  estado_cobranza: activo
                  estado_cliente: Pago regular
                  recargo_permanente: false
                  monto_pago_referencia_usd: 53
                  monto_pago_referencia_bs: 54930.0
                  zona_gris: false
                  cuotas_pagadas: 0
                  cuotas_total: 52
                  proxima_cuota:
                    numero_cuota: 1
                    estado: vencida
                    fecha_vencimiento: "2026-08-03T00:00:00Z"
                    monto_esperado_usd: 53
                    monto_esperado_bs: 54930.0
                    monto_puntual_usd: 53
                    penalidad_prospectiva_usd: 5
                    penalidad_prospectiva_bs: 5182.08
                error: null
                code: 200
        "401":
          description: ERR_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: No autorizado
                data: null
                error: ERR_UNAUTHORIZED
                code: 401
        "403":
          description: ERR_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: No autorizado para este contrato
                data: null
                error: ERR_FORBIDDEN
                code: 403

  /v1/portal-cliente/notificaciones:
    get:
      tags: [portal-cliente]
      summary: Inbox de campañas del contrato del JWT
      operationId: portalClienteNotificaciones
      security:
        - PortalClienteBearer: []
      description: |
        Lista entregas **enviadas** de campañas de mensajería al `contrato_id`
        del JWT (nunca del query/body). El HTML se sanitiza con la misma
        lista blanca que el staff. **No incluye** recordatorios automáticos
        de vencimiento (`mensajeria_auto_envios`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            entrega_id: { type: integer }
                            campana_id: { type: integer }
                            titulo: { type: string }
                            cuerpo_sms: { type: string }
                            cuerpo_rico: { type: string }
                            canal: { type: string }
                            estado: { type: string }
                            enviado_at: { type: string, format: date-time }
                  error: { type: string, nullable: true }
                  code: { type: integer }
              example:
                message: Notificaciones
                data:
                  items: []
                error: null
                code: 200
        "401":
          description: ERR_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ERR_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/portal-cliente/notificaciones/pendiente-modal:
    get:
      tags: [portal-cliente]
      summary: Notificación pendiente para modal
      operationId: portalClienteNotificacionPendienteModal
      security:
        - PortalClienteBearer: []
      description: |
        Devuelve la única campaña pendiente de ver del contrato incluido en el
        JWT. Es de solo lectura: consultar este endpoint no confirma la
        notificación. `item` es `null` cuando no existe una pendiente.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      item:
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              campana_id: { type: integer }
                              titulo: { type: string }
                              cuerpo_sms: { type: string }
                              cuerpo_rico: { type: string }
                              canal:
                                type: string
                                enum: [sms, email, ambos]
                              enviado_at: { type: string, format: date-time }
                            required:
                              - campana_id
                              - titulo
                              - cuerpo_sms
                              - cuerpo_rico
                              - canal
                  error: { type: string, nullable: true }
                  code: { type: integer }
              example:
                message: Notificacion pendiente
                data:
                  item: null
                error: null
                code: 200
        "401":
          description: ERR_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ERR_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/portal-cliente/notificaciones/{campana_id}/confirmar:
    post:
      tags: [portal-cliente]
      summary: Confirmar recepción de notificación
      operationId: portalClienteConfirmarNotificacion
      security:
        - PortalClienteBearer: []
      description: |
        Marca como recibida la campaña pendiente del contrato incluido en el
        JWT y llena `visto_en`. Es idempotente si esa misma campaña ya estaba
        recibida. No acepta `contrato_id` en query ni body.
      parameters:
        - name: campana_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Confirmada o ya confirmada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      campana_id: { type: integer }
                      estado:
                        type: string
                        const: recibido
                  error: { type: string, nullable: true }
                  code: { type: integer }
              example:
                message: Notificacion recibida
                data:
                  campana_id: 123
                  estado: recibido
                error: null
                code: 200
        "401":
          description: ERR_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ERR_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ERR_NOTIFICACION_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ERR_NOTIFICACION_NO_CONFIRMABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/portal-cliente/pagos/reportar:
    post:
      tags: [portal-cliente]
      summary: Reportar pago (en_proceso)
      operationId: portalClienteReportarPago
      security:
        - PortalClienteBearer: []
      description: |
        Reutiliza `RegistrarPagoEnProceso` con `AutoReportadoCliente=true`.
        El `contrato_id` sale **solo** del JWT (el body no puede fijar otro).
        El pago queda `en_proceso` hasta confirmación/rechazo humano.
        Validación de sanidad de `fecha_pago`: no futura (tolerancia 5 min) ni
        anterior a la firma del contrato.

        **Requiere autenticación previa:** 1) `POST /v1/portal-cliente/auth/solicitar-otp`
        con tu cédula, 2) `POST /v1/portal-cliente/auth/verificar-otp` con el
        código recibido por SMS para obtener el `access_token`, 3) usa ese
        token aquí (botón **Authorize** arriba).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportarPagoRequest"
            example:
              canal: pay_zelle
              monto: 51
              moneda: USD
              referencia_externa: ZELLE-REF-48291
              fecha_pago: "2026-08-09T15:30:00Z"
      responses:
        "201":
          description: Pago en_proceso creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseReportarPago"
              example:
                message: pago en_proceso; protege cuota 5 hasta confirmación contable
                data:
                  pago:
                    id: pag_01JABCDEFGHJKLMNPQRSTUVWX
                    contrato_id: 2062
                    canal: pay_zelle
                    referencia_externa: ZELLE-REF-48291
                    monto: "51.0000"
                    moneda: USD
                    verificado_por: null
                    fecha_pago: "2026-08-09T15:30:00Z"
                    estado: en_proceso
                    cuota_protegida_id: cuo_01JXYZABCDEFGHJKLMNPQRST
                    created_at: "2026-08-09T15:31:02.123Z"
                  numero_cuota: 5
                  cuota_protegida_id: cuo_01JXYZABCDEFGHJKLMNPQRST
                  mensaje: pago en_proceso; protege cuota 5 hasta confirmación contable
                error: null
                code: 201
        "400":
          description: ERR_FECHA_PAGO u otra validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: fecha_pago no puede ser posterior a ahora
                data: null
                error: ERR_FECHA_PAGO
                code: 400
        "401":
          description: ERR_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: No autorizado
                data: null
                error: ERR_UNAUTHORIZED
                code: 401
        "403":
          description: ERR_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: No autorizado para este contrato
                data: null
                error: ERR_FORBIDDEN
                code: 403
        "409":
          description: ERR_SIN_CUOTA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: No hay cuota abierta para proteger
                data: null
                error: ERR_SIN_CUOTA
                code: 409

components:
  securitySchemes:
    # Nombre referenciado en security: de mi-cuenta y pagos/reportar.
    # Swagger UI muestra Authorize (candado) global al detectar este scheme
    # tipo http/bearer; el token pegado se aplica a esas operaciones.
    PortalClienteBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT RS256 `aud=portal-cliente` (clave `PORTAL_CLIENTE_JWT_KEY_PATH`).
        Obtenerlo con verificar-otp. En Authorize pega solo el token
        (Swagger agrega el prefijo Bearer).

  schemas:
    ApiError:
      type: object
      required: [message, data, error, code]
      properties:
        message: { type: string }
        data: { type: "null" }
        error: { type: string }
        code: { type: integer }

    SolicitarOTPRequest:
      type: object
      required: [cedula]
      properties:
        cedula:
          type: string
          example: "111624956"
          description: Cédula venezolana (el servidor normaliza)

    VerificarOTPRequest:
      type: object
      required: [cedula, codigo]
      properties:
        cedula: { type: string, example: "111624956" }
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          example: "482917"

    ReportarPagoRequest:
      type: object
      required: [canal, monto, moneda, fecha_pago]
      properties:
        canal:
          type: string
          enum: [pay_zelle, pay_binance, efectivo_concesionario, pago_movil, deposito_custodio]
          example: pay_zelle
        monto: { type: number, exclusiveMinimum: 0, example: 51 }
        moneda: { type: string, minLength: 3, maxLength: 3, example: USD }
        referencia_externa: { type: string, maxLength: 255, example: ZELLE-REF-48291 }
        fecha_pago:
          type: string
          format: date-time
          example: "2026-08-09T15:30:00Z"

    SolicitarOTPData:
      type: object
      required: [destination_masked, expires_in_seconds, channel]
      properties:
        destination_masked: { type: string, example: "****2233" }
        expires_in_seconds: { type: integer, example: 300 }
        channel: { type: string, example: sms }

    VerificarOTPData:
      type: object
      required: [access_token, expires_in_seconds, cliente_id, contrato_id]
      properties:
        access_token:
          type: string
          description: Pegar en Authorize (sin prefijo Bearer)
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJwb3J0YWwtY2xpZW50ZSJ9.signature
        expires_in_seconds: { type: integer, example: 86400 }
        cliente_id: { type: integer, format: int64, example: 1042 }
        contrato_id: { type: integer, format: int64, example: 2062 }

    MiCuentaProximaCuota:
      type: object
      properties:
        numero_cuota: { type: integer, example: 1 }
        estado:
          type: string
          example: vencida
          enum: [pendiente, vencida]
          description: >
            Estado oficial de la cuota en cobranzas (`pendiente` o `vencida`).
            `vencida` lo marca el vencimiento_worker tras el corte 15:30 America/Caracas
            del día de `fecha_vencimiento`. La app de autogestión debe usar este campo
            (no comparar `fecha_vencimiento` con `Date` del navegador) para el label
            "vence" vs "vencida".
        fecha_vencimiento:
          type: string
          format: date-time
          example: "2026-08-03T00:00:00Z"
          description: >
            Día de vencimiento de la cuota. No implica mora por sí solo: una fecha
            ya pasada puede seguir `estado=pendiente` hasta el corte 15:30 Caracas.
        monto_esperado_usd:
          type: number
          example: 53
          description: >
            Base del contrato (puntual ± recargo) más penalidad_retraso_aplicada
            histórica de BD si ya se cobró. No incluye la prospectiva.
        monto_esperado_bs: { type: number, example: 54930.0 }
        monto_puntual_usd: { type: number, example: 53 }
        penalidad_prospectiva_usd:
          type: number
          nullable: true
          example: 5
          description: >
            Cargo adicional prospectivo si la cuota está vencida y pagara HOY
            (PenalidadRetrasoProspectiva). Omitido/null si no aplica o convenio
            activo lo reduce a 0. No es el monto base del contrato — la app debe
            mostrarlo en línea aparte con nota de atraso, sin sumarlo opaco al base.
        penalidad_prospectiva_bs:
          type: number
          nullable: true
          example: 5182.08
          description: >
            Equivalente Bs de penalidad_prospectiva_usd (misma tasa/param que
            monto_esperado_bs). Solo presente cuando la prospectiva USD está poblada.

    MiCuentaData:
      type: object
      properties:
        cliente_id: { type: integer, format: int64, example: 1042 }
        contrato_id: { type: integer, format: int64, example: 2062 }
        mongo_contrato_id: { type: string, example: con_MIGTEST_S00989 }
        cedula: { type: string, example: "111624956" }
        nombre: { type: string, example: Gabriel Quintero }
        estado_cobranza: { type: string, example: activo }
        estado_cliente: { type: string, example: Pago regular }
        recargo_permanente: { type: boolean, example: true }
        monto_pago_referencia_usd:
          type: number
          example: 51
          description: Encabezado (puntual o puntual+recargo; sin penalidad)
        monto_pago_referencia_bs: { type: number, example: 52857.216 }
        zona_gris: { type: boolean, example: false }
        cuotas_pagadas: { type: integer, example: 4 }
        cuotas_total: { type: integer, example: 52 }
        proxima_cuota:
          $ref: "#/components/schemas/MiCuentaProximaCuota"

    PagoEnProceso:
      type: object
      properties:
